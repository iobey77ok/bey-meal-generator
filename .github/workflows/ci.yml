name: CI

# This workflow runs tests and builds the frontend whenever code is pushed 
# to the main branch or a pull request is opened against it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow consists of two jobs: one for running backend tests 
# and another for building the frontend.
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # This job checks out the code, sets up Node.js, 
    # installs dependencies, and builds the frontend.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
